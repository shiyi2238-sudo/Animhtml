<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite PDF Generator - Termux Manual</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059; /* Gold */
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .editor-section {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #121212;
            color: #00ff41; /* Green Terminal Color */
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-preview { background: #444; color: white; }
        .btn-download { background: var(--primary); color: #1a1a1a; }
        
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        /* PDF Styles (Hidden by default, used for generation) */
        #pdf-content {
            background: white;
            color: black;
            padding: 40px;
            display: none; /* Only show in preview or during PDF generation */
        }

        .preview-mode #pdf-content {
            display: block;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* Styling di dalam PDF */
        .pdf-header {
            text-align: center;
            border-bottom: 3px solid #333;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
        }

        .pdf-table th {
            background: #f0f0f0;
            text-align: left;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .pdf-table td {
            padding: 10px;
            border: 1px solid #ccc;
            vertical-align: top;
        }

        .cmd-text {
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            color: #d32f2f;
        }

        .no-text { width: 40px; text-align: center; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PDF MANUAL GENERATOR</h1>
        <p>Format: perintah | penjelasan (satu baris satu perintah)</p>
    </div>

    <div class="editor-section">
        <label>Input Data Perintah:</label>
        <textarea id="inputText" placeholder="Contoh:&#10;pkg update | Memperbarui sistem&#10;ls | Menampilkan file"></textarea>
        
        <div class="controls">
            <button class="btn-preview" onclick="generatePreview()">Lihat Preview</button>
            <button class="btn-download" onclick="exportToPDF()">Export ke PDF</button>
        </div>
    </div>

    <!-- Area Preview & PDF -->
    <div id="preview-container">
        <div id="pdf-content">
            <div class="pdf-header">
                <h1 style="margin:0;">DAFTAR PERINTAH TERMUX</h1>
                <p style="margin:5px 0; color:#666;">Katalog Referensi Teknis - Generated by Elite System</p>
            </div>
            <table class="pdf-table">
                <thead>
                    <tr>
                        <th class="no-text">No</th>
                        <th style="width:30%;">Perintah</th>
                        <th>Penjelasan Singkat</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data masuk di sini -->
                </tbody>
            </table>
            <div style="margin-top:30px; font-size:10px; color:#999; text-align:right;">
                Dicetak pada: <span id="printDate"></span>
            </div>
        </div>
    </div>
</div>

<script>
    // Sample data awal agar tidak kosong
    const sampleData = "pkg update | Memperbarui daftar paket Termux\npkg upgrade | Meningkatkan versi paket terinstal\nls | Menampilkan daftar file dalam direktori\npwd | Melihat lokasi direktori saat ini\ncd /sdcard | Pindah ke penyimpanan internal\nmkdir folder_baru | Membuat direktori baru\nrm file.txt | Menghapus file tertentu\ncp file1 file2 | Menyalin file\nmv old.txt new.txt | Mengganti nama atau pindah file\nchmod +x script.sh | Memberi izin eksekusi file\napt install python | Menginstal bahasa pemrograman Python\ncurl -L url | Mengunduh file dari internet\ntop | Monitoring proses sistem real-time\nifconfig | Melihat konfigurasi jaringan/IP\nexit | Keluar dari terminal";
    document.getElementById('inputText').value = sampleData;

    function parseData() {
        const text = document.getElementById('inputText').value;
        const lines = text.split('\n');
        const data = [];
        
        lines.forEach(line => {
            if(line.includes('|')) {
                const parts = line.split('|');
                data.push({
                    cmd: parts[0].trim(),
                    desc: parts[1].trim()
                });
            }
        });
        return data;
    }

    function generatePreview() {
        const data = parseData();
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        if(data.length === 0) {
            alert("Format salah! Gunakan format: perintah | penjelasan");
            return;
        }

        data.forEach((item, index) => {
            const row = `
                <tr>
                    <td class="no-text">${index + 1}</td>
                    <td class="cmd-text">${item.cmd}</td>
                    <td>${item.desc}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        document.getElementById('printDate').innerText = new Date().toLocaleString('id-ID');
        document.body.classList.add('preview-mode');
        window.scrollTo(0, document.body.scrollHeight);
    }

    function exportToPDF() {
        // Pastikan preview sudah digenerate dulu
        generatePreview();

        const element = document.getElementById('pdf-content');
        const opt = {
            margin:       10,
            filename:     'Katalog_Perintah_Termux.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, logging: true, dpi: 192, letterRendering: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // Jalankan konversi dan download otomatis
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
