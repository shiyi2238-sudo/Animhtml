<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated HTML Editor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1e1e1e;
            color: white;
        }
        #editor-container {
            height: 40vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        textarea {
            flex: 1;
            background: #252526;
            color: #d4d4d4;
            border: 1px solid #333;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            resize: none;
            outline: none;
            border-radius: 8px;
        }
        #preview-container {
            flex: 1;
            background: #f0f0f0;
            color: black;
            overflow: auto;
            padding: 20px;
            border-top: 5px solid #333;
            border-radius: 20px 20px 0 0;
        }
        header {
            padding: 15px;
            background: #333;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-clear {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <span>✨ AnimHTML</span>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
    </header>
    <div id="editor-container">
        <textarea id="html-input" placeholder="Ketik HTML... (contoh: <h1>Halo!</h1>)"></textarea>
    </div>
    <div id="preview-container" id="preview">
        <!-- Hasil render akan muncul di sini -->
    </div>

    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Error', err));
            });
        }

        const input = document.getElementById('html-input');
        const preview = document.getElementById('preview-container');

        function clearAll() {
            input.value = "";
            preview.innerHTML = "";
        }

        input.addEventListener('input', () => {
            const content = input.value;
            const parser = new DOMParser();
            const doc = parser.parseFromString(content, 'text/html');
            const elements = doc.body.children;

            preview.innerHTML = "";

            Array.from(elements).forEach((el, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "animate__animated animate__zoomIn"; 
                wrapper.style.marginBottom = "10px";
                wrapper.innerHTML = el.outerHTML;
                preview.appendChild(wrapper);
            });
        });
    </script>
</body>
</html>
