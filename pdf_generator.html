<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite PDF Generator - Termux Manual</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059; /* Gold */
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .editor-section {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #121212;
            color: #00ff41; /* Green Terminal Color */
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-preview { background: #444; color: white; }
        .btn-download { background: var(--primary); color: #1a1a1a; }
        
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        /* PDF Styles (Hidden by default, used for generation) */
        #pdf-content {
            background: white;
            color: black;
            padding: 20px;
            width: 790px; /* Lebar standar A4 pixel */
            margin: 0 auto;
            display: none;
        }

        .preview-mode #pdf-content {
            display: block;
            margin-top: 20px;
            border: 1px solid #ccc;
        }

        /* Styling di dalam PDF */
        .pdf-header {
            text-align: center;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Menghindari kolom meluap */
        }

        .pdf-table th, .pdf-table td {
            padding: 8px;
            border: 1px solid #000;
            word-wrap: break-word;
        }

        .pdf-table th { background: #eee; }

        .cmd-text {
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            color: #d32f2f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PDF MANUAL GENERATOR v2</h1>
        <p>Format: perintah | penjelasan (satu baris satu perintah)</p>
    </div>

    <div class="editor-section">
        <label>Input Data Perintah:</label>
        <textarea id="inputText" placeholder="Contoh:&#10;pkg update | Memperbarui sistem&#10;ls | Menampilkan file"></textarea>
        
        <div class="controls">
            <button class="btn-preview" onclick="generatePreview()">Lihat Preview</button>
            <button class="btn-download" onclick="exportToPDF()">Export ke PDF</button>
        </div>
    </div>

    <div id="pdf-content">
        <div class="pdf-header">
            <h1 style="margin:0;">DAFTAR PERINTAH TERMUX</h1>
            <p style="margin:5px 0;">Katalog Referensi Teknis - Elite Restorer System</p>
        </div>
        <table class="pdf-table">
            <thead>
                <tr>
                    <th style="width:10%;">No</th>
                    <th style="width:30%;">Perintah</th>
                    <th style="width:60%;">Penjelasan Singkat</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div style="margin-top:20px; font-size:10px; color:#666; text-align:right;">
            Generated on: <span id="printDate"></span>
        </div>
    </div>
</div>

<script>
    // Sample data yang lebih banyak untuk tes multi-halaman
    const sampleData = Array.from({length: 50}, (_, i) => `pkg command_${i+1} | Ini adalah penjelasan untuk perintah nomor ${i+1} agar mencukupi banyak halaman.`).join('\n');
    document.getElementById('inputText').value = sampleData;

    function generatePreview() {
        const text = document.getElementById('inputText').value;
        const lines = text.split('\n');
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        let count = 0;
        lines.forEach(line => {
            if(line.trim() && line.includes('|')) {
                count++;
                const parts = line.split('|');
                const row = `
                    <tr>
                        <td style="text-align:center">${count}</td>
                        <td class="cmd-text">${parts[0].trim()}</td>
                        <td>${parts[1].trim()}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            }
        });

        if(count === 0) {
            alert("Harap masukkan data dengan format: perintah | penjelasan");
            return;
        }

        document.getElementById('printDate').innerText = new Date().toLocaleString('id-ID');
        document.body.classList.add('preview-mode');
    }

    function exportToPDF() {
        generatePreview();
        const element = document.getElementById('pdf-content');
        
        // Tampilkan elemen sementara untuk capture (penting untuk html2pdf)
        element.style.display = 'block';

        const opt = {
            margin:       10,
            filename:     'Katalog_Termux_Lengkap.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            // Sembunyikan kembali jika tidak dalam mode preview
            if (!document.body.classList.contains('preview-mode')) {
                element.style.display = 'none';
            }
        });
    }
</script>

</body>
</html>
